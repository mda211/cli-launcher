[package]
name = "cli-launcher"
version = "0.3.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
base64 = "0.22.1"
fastrand = "2.3.0"
open = "5.3.3"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tokio = { version = "1", features = ["full"] }
toml = "0.9.11"
urlencoding = "2.1.3"
